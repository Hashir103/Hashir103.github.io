<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<!--
  TEMPLATE: copy this file into blog/posts/ with a new name (e.g. iceland-trip.html), then:
    1. set <title> to the post title
    2. set the date meta tag below to the post date (YYYY-MM-DD)
    3. update the <h1> and .date line and write the post inside .page
  The blog list shows "<date> - <title>" and never lists this template.html itself.
-->
<title>Post Title</title>
<meta name="date" content="YYYY-MM-DD">
<link rel="icon" href="../../images/icon-notepad.png">
<link rel="stylesheet" href="../blog.css">
</head>
<body>
  <div class="notepad">
    <div class="titlebar">
      <span class="title"><img src="../../images/icon-notepad.png" alt=""> Post Title - Notepad</span>
      <a class="close" href="../" title="Back to blog">×</a>
    </div>
    <nav class="menubar">
      <a href="../">&larr; Blog</a>
      <span>File</span><span>Edit</span><span>Format</span><span>View</span><span>Help</span>
    </nav>
    <main class="page">
      <h1>Post Title</h1>
      <p class="date">YYYY-MM-DD</p>

      <p>Write your post here.</p>
    </main>
  </div>
</body>
</html>
